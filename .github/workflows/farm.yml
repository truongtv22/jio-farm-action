name: Jio Farm Execution

on:
  workflow_dispatch:
    inputs:
      target_links:
        description: 'Target jumlah link'
        required: true
        default: '1'
      max_runtime_minutes:
        description: 'Maks runtime (menit)'
        required: true
        default: '30'
  schedule:
    - cron: '0 */2 * * *'

jobs:
  run-farm:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests

      - name: Execute Farm Script
        run: python3 jio_gemini_farm.py --target ${{ inputs.target_links || 1 }} --sweep 60 --max-runtime ${{ inputs.max_runtime_minutes || 25 }}
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}

      - name: Check Results
        id: check
        run: |
          COUNT=$(wc -l < fresh_links.txt 2>/dev/null || echo 0)
          echo "links_count=$COUNT" >> $GITHUB_OUTPUT

      - name: Upload Outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: farm-results-${{ github.run_id }}
          path: |
            fresh_links.txt
            farm_results.csv
            farm.log
          if-no-files-found: warn
          retention-days: 7